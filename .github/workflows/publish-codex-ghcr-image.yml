name: Publish Codex GHCR Image

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "codex-rs/**"
      - "codex-cli/**"
      - ".github/workflows/publish-codex-ghcr-image.yml"

concurrency:
  group: publish-codex-ghcr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: Build and Publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build codex binary (bookworm toolchain container)
        run: |
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/work" \
            -w /work \
            rust:1-bookworm \
            bash -lc '
              set -euo pipefail
              export PATH=/usr/local/cargo/bin:$PATH
              # Keep peak memory bounded on GitHub-hosted runners.
              export CARGO_BUILD_JOBS=2
              export CARGO_INCREMENTAL=0
              export CARGO_PROFILE_RELEASE_CODEGEN_UNITS=16
              export CARGO_PROFILE_RELEASE_DEBUG=0
              export CARGO_PROFILE_RELEASE_LTO=off
              apt-get update
              apt-get install -y --no-install-recommends pkg-config libcap-dev
              echo "build-env: jobs=${CARGO_BUILD_JOBS} codegen_units=${CARGO_PROFILE_RELEASE_CODEGEN_UNITS} debug=${CARGO_PROFILE_RELEASE_DEBUG} lto=${CARGO_PROFILE_RELEASE_LTO}"
              cargo build --manifest-path codex-rs/Cargo.toml -p codex-cli --release
            '

      - name: Stage Docker build artifacts
        run: |
          mkdir -p codex-cli/dist
          cp codex-rs/target/release/codex codex-cli/dist/codex
          chmod +x codex-cli/dist/codex

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/codex
          tags: |
            type=raw,value=main,enable={{is_default_branch}}
            type=sha,prefix=sha-

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: codex-cli
          file: codex-cli/Dockerfile.workspace-agent
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
