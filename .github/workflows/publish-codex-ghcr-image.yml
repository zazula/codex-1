name: Publish Codex GHCR Image

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "codex-rs/**"
      - "codex-cli/**"
      - ".github/workflows/publish-codex-ghcr-image.yml"

concurrency:
  group: publish-codex-ghcr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: Build and Publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libcap-dev

      - name: Build codex binary
        run: cargo build --manifest-path codex-rs/Cargo.toml -p codex-cli --release

      - name: Stage Docker build artifacts
        run: |
          mkdir -p codex-cli/dist
          cp codex-rs/target/release/codex codex-cli/dist/codex
          chmod +x codex-cli/dist/codex

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/codex
          tags: |
            type=raw,value=main,enable={{is_default_branch}}
            type=sha,prefix=sha-

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: codex-cli
          file: codex-cli/Dockerfile.workspace-agent
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
